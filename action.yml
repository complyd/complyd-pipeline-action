name: Complyd pipeline
description: Send your pipeline's dependency scan, SAST scan or AI eval results to Complyd, signed in with the workflow's OIDC token.
author: Complyd
branding:
  icon: shield
  color: blue
inputs:
  trust:
    description: The workload trust id from Complyd (Settings › Workload trusts), trw_…
    required: true
  audience:
    description: The trust's audience, shown next to its id in Complyd. Defaults to https://api.complyd.ai/observations/<trust> (on the api-url host if set); set it only if Complyd shows a different one, e.g. for a rotated trust.
    required: false
  results:
    description: Path of the scanner's output file (SARIF 2.1.0 or OSV-Scanner JSON). For scan sast, SARIF only, and a directory of .sarif files or one path per line is merged into one scan. Set this or `input`.
    required: false
  input:
    description: Same as `results` (the name scan ai_eval uses), e.g. the eval tool's results file.
    required: false
  scan:
    description: dependencies (default; dependency also works), sast or ai_eval. sast reads a SAST scanner's SARIF (CodeQL, Semgrep, …); ai_eval an AI eval tool's results with .complyd/ai.yml.
    required: false
    default: dependencies
  format:
    description: "auto, sarif or osv (auto reads the file to tell). For scan ai_eval, the eval tool: promptfoo, deepeval, openai-evals, lm-eval or generic."
    required: false
    default: auto
  scanner-version:
    description: The scanner's version, sent over the one in its output (OSV-Scanner JSON names none), e.g. 2.7.1. Complyd counts a scan only with a version number.
    required: false
  lockfile:
    description: scan dependencies only. The lockfile the scanner read; only its SHA-256 is sent, which shows a scan with no packages read one. Defaults to the first lockfile the scanner's output names that is on the runner.
    required: false
  files-scanned:
    description: scan sast only. The number of files the scanner scanned, sent over the count the SARIF gives (CodeQL's extracted files, else the files with findings; Semgrep names only those).
    required: false
  role:
    description: scan ai_eval only. candidate (default, the change being released) or baseline (the version in production, re-run for comparison).
    required: false
    default: candidate
  suite-config:
    description: scan ai_eval only. Path of the AI config in the repository.
    required: false
    default: .complyd/ai.yml
  api-url:
    description: For testing only. Complyd's address (https://api.complyd.ai or https://api-dev.complyd.ai); defaults to the audience's origin (else https://api.complyd.ai) and must be on the audience's host.
    required: false
outputs:
  observation:
    description: The id Complyd gave the stored scan (obs_…).
  dropped:
    description: How many findings the action couldn't read (the scan is then marked cut).
runs:
  using: node24
  main: src/main.js
