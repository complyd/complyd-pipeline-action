name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24: the action's runtime; 20: the oldest Node the CLI supports.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm pack --dry-run
      # A release tag (vX.Y.Z) must name the version the action reports to
      # Complyd (package.json "version" is sent as collector_version). The
      # moving v1 tag is only ever moved to a commit that has one.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($want)"; exit 1; }
