name: Release
# A vX.Y.Z tag (see RELEASING.md): test, then, once a maintainer approves the
# `release` environment, push ghcr.io/complyd/pipeline to GHCR and publish
# @complyd/pipeline to npm, both from that one gated job. The moving v1 tag doesn't match.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Protected: required reviewers (maintainers). The job waits for approval
    # before any step runs, and the first step fails it if that protection is missing.
    environment: release
    permissions:
      contents: read
      actions: read # read the environment's protection rules
      id-token: write # npm trusted publishing and provenance; build attestation
      packages: write # GHCR
      attestations: write
    env:
      IMAGE: ghcr.io/complyd/pipeline
    steps:
      # The tagged commit's copy of this file runs, so these checks catch mistakes only; the
      # environment's own settings (RELEASING.md §3) are what a tagger can't change.
      - name: The release environment requires a reviewer and admits only release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/release")
          rules=$(jq -r '[.protection_rules[]?.type] | join(",")' <<<"$env_json")
          case ",$rules," in
            *,required_reviewers,*) ;;
            *) echo "::error::The release environment has no required reviewers: add them before releasing."; exit 1 ;;
          esac
          [ "$(jq -r '.can_admins_bypass' <<<"$env_json")" = false ] || { echo "::error::Turn off 'Allow administrators to bypass' on the release environment."; exit 1; }
          [ "$(jq -r '.deployment_branch_policy != null' <<<"$env_json")" = true ] || { echo "::error::Limit the release environment to tags v*.*.*."; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches package.json and is on main
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($want)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not a commit of main"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Node 24's own npm, not one downloaded into this job: trusted publishing needs 11.5.1 or later.
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "::error::npm $v is older than 11.5.1"; exit 1; }

      # The image is built and checked first and npm published last: an npm version can never
      # be re-published, so nothing may fail after it. A re-run re-pushes the same image tag.
      # shortcut: linux/amd64 only (plain docker build); add buildx + QEMU when an arm64 image is asked for.
      - name: Build and check the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --pull -t "$IMAGE:$version" .
          [ "$(docker run --rm "$IMAGE:$version" --version)" = "$version" ] || { echo "::error::The image doesn't report $version"; exit 1; }
      - name: Push the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$version"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$version ($IMAGE@$digest)" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish to npm
        env:
          # Only for the package's first version (RELEASING.md §3): a secret of the release
          # environment, deleted once the trusted publisher is set. Empty after that: OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: |
          # private: true guards main against an accidental publish; dropped here only, never committed.
          npm pkg delete private
          npm publish --access public --provenance
